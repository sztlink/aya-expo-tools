[package]
name = "aya-expo-tools"
version = "2.1.0"
description = "AYA Expo Tools — Sistema operacional de exposições"
authors = ["Felipe Sztutman <felipe@aya.cx>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["shell-open"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
